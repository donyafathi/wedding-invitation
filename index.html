<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f3ed" />
  <title>دعوتنامه عروسی</title>

  <!-- Optional Persian font. The page still works if the browser is offline. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600&family=Marhey:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --paper:#f8f5ef;
      --paper-deep:#eee8df;
      --ink:#68605c;
      --gold:#b69a62;
      --gold-dark:#8e7342;
      --purple:#9b58b8;
      --bg:#eee9e1;
      --shadow:0 28px 70px rgba(70,54,42,.20);
    }

    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;width:100%}
    body{
      overflow-x:hidden;
      background:
        radial-gradient(circle at 50% 15%, rgba(255,255,255,.95), transparent 34%),
        radial-gradient(circle at 10% 90%, rgba(181,154,111,.10), transparent 30%),
        linear-gradient(135deg,#e9e3db,#f7f3ed 45%,#e7e0d8);
      color:var(--ink);
      font-family:"Vazirmatn",Tahoma,sans-serif;
    }

    body::before{
      content:"";
      position:fixed;inset:0;pointer-events:none;opacity:.25;
      background-image:
        repeating-linear-gradient(0deg,rgba(100,80,60,.025) 0 1px,transparent 1px 4px),
        repeating-linear-gradient(90deg,rgba(100,80,60,.018) 0 1px,transparent 1px 5px);
      mix-blend-mode:multiply;
    }

    button{font:inherit}

    .scene{
      min-height:100svh;
      display:grid;
      place-items:center;
      padding:clamp(18px,4vw,44px);
      perspective:1600px;
    }

    .experience{
      width:min(94vw,760px);
      min-height:min(92svh,900px);
      display:grid;
      place-items:center;
      position:relative;
    }

    /* ---------- CLOSED POCKET ---------- */
    .pocket-wrap{
      width:min(78vw,560px);
      aspect-ratio: 720 / 560;
      position:relative;
      transform-style:preserve-3d;
      filter:drop-shadow(0 28px 28px rgba(63,48,37,.18));
      transition:opacity .8s ease, transform 1s ease;
    }

    .pocket-wrap.opened{
      transform:translateY(2vh) scale(.92);
      opacity:.18;
      pointer-events:none;
    }

    .pocket{
      position:absolute;inset:0;
      overflow:visible;
      transform-style:preserve-3d;
    }

    .pocket-back{
      position:absolute;inset:0;
      border-radius:12px;
      background:
        linear-gradient(135deg,rgba(255,255,255,.7),transparent 42%),
        linear-gradient(180deg,#fbf8f2,#eee8df);
      border:1px solid rgba(130,105,80,.16);
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.65);
    }

    .pocket-back::after{
      content:"";
      position:absolute;inset:8px;
      border:1px solid rgba(167,137,93,.22);
      border-radius:8px;
      pointer-events:none;
    }

    .flap{
      position:absolute;
      z-index:6;
      left:0;right:0;top:-1px;
      height:72%;
      transform-origin:50% 0%;
      clip-path:polygon(0 0,100% 0,50% 100%);
      background:
        linear-gradient(180deg,rgba(255,255,255,.9),rgba(239,233,224,.98)),
        var(--paper);
      border:1px solid rgba(128,102,76,.18);
      box-shadow:0 14px 25px rgba(70,50,35,.13);
      transition:transform 1.5s cubic-bezier(.18,.75,.18,1);
      transform-style:preserve-3d;
    }

    .flap::after{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at 50% 34%,rgba(182,154,98,.09),transparent 22%),
        linear-gradient(135deg,transparent 47%,rgba(156,121,77,.08) 50%,transparent 53%);
      clip-path:inherit;
    }

    .pocket-wrap.opened .flap{
      transform:rotateX(-170deg);
      box-shadow:0 -12px 25px rgba(70,50,35,.08);
    }

    .pocket-front{
      position:absolute;
      z-index:5;
      left:0;right:0;bottom:0;
      height:64%;
      background:
        linear-gradient(135deg,rgba(255,255,255,.72),transparent 45%),
        linear-gradient(180deg,#faf7f1,#eee8df);
      clip-path:polygon(0 0,50% 43%,100% 0,100% 100%,0 100%);
      border-radius:0 0 12px 12px;
      border:1px solid rgba(128,102,76,.18);
      box-shadow:0 -6px 16px rgba(72,50,35,.08),inset 0 0 0 1px rgba(255,255,255,.55);
    }

    .pocket-front::before{
      content:"";
      position:absolute;inset:10px;
      border:1px solid rgba(167,137,93,.18);
      border-radius:7px;
      clip-path:polygon(0 0,50% 43%,100% 0,100% 100%,0 100%);
    }

    /* Soft floral ornaments inspired by the provided card */
    .floral{
      position:absolute;
      width:150px;height:130px;
      opacity:.8;
      pointer-events:none;
      z-index:2;
    }
    .floral.tl{left:-18px;top:-15px;transform:rotate(-8deg)}
    .floral.br{right:-20px;bottom:-18px;transform:rotate(8deg) scale(.9)}
    .stem{
      position:absolute;width:125px;height:4px;border-radius:99px;
      background:linear-gradient(90deg,#8a7a4c,#b89a67,#8a7a4c);
      transform-origin:left center;
      top:72px;left:4px;transform:rotate(-28deg);
    }
    .leaf{
      position:absolute;width:34px;height:18px;border-radius:100% 0 100% 0;
      background:linear-gradient(135deg,#b9b88b,#817b51);
      transform:rotate(-35deg);
      box-shadow:inset 2px 2px 3px rgba(255,255,255,.4);
    }
    .l1{left:35px;top:40px}.l2{left:65px;top:55px;transform:rotate(25deg)}
    .l3{left:92px;top:72px;transform:rotate(-20deg)}
    .flower{
      position:absolute;width:45px;height:45px;border-radius:50%;
      background:
        radial-gradient(circle at 50% 50%,#ffd58a 0 10%,transparent 11%),
        conic-gradient(#a35ac2 0 12%,transparent 12% 20%,#b36cd0 20% 33%,transparent 33% 41%,#9250b2 41% 54%,transparent 54% 62%,#ad62c8 62% 76%,transparent 76% 84%,#9953b7 84% 100%);
      filter:drop-shadow(0 4px 4px rgba(92,56,90,.18));
    }
    .f1{left:0;top:0}.f2{left:93px;top:75px;transform:scale(.72)}

    /* ---------- SEAL ---------- */
    .seal{
      position:absolute;
      z-index:20;
      left:50%;top:53%;
      width:92px;height:92px;
      transform:translate(-50%,-50%);
      border:0;
      border-radius:50%;
      cursor:pointer;
      color:#fff8e9;
      background:
        radial-gradient(circle at 35% 28%,rgba(255,255,255,.45),transparent 17%),
        radial-gradient(circle at 50% 50%,#bd3e69 0 38%,#9b294f 39% 67%,#7f1e40 68% 100%);
      box-shadow:
        0 7px 13px rgba(82,32,45,.28),
        inset 0 2px 4px rgba(255,255,255,.35),
        inset 0 -5px 8px rgba(62,12,29,.28);
      transition:transform .25s ease,filter .25s ease;
    }

    .seal::before{
      content:"";
      position:absolute;inset:6px;border-radius:50%;
      border:1px solid rgba(255,226,192,.38);
      box-shadow:inset 0 0 0 2px rgba(90,15,34,.15);
    }

    .seal::after{
      content:"";
      position:absolute;inset:-8px;
      border-radius:48% 52% 51% 49%;
      border:5px solid rgba(125,29,58,.72);
      filter:blur(.2px);
      z-index:-1;
    }

    .seal:hover{transform:translate(-50%,-50%) scale(1.06);filter:brightness(1.05)}
    .seal:active{transform:translate(-50%,-50%) scale(.96)}
    .seal span{
      position:relative;
      display:block;
      font-family:"Marhey",serif;
      font-size:25px;
      transform:rotate(-5deg);
      text-shadow:0 1px 1px rgba(0,0,0,.18);
    }
    .seal small{
      display:block;
      margin-top:-2px;
      font-size:8px;
      letter-spacing:2px;
      opacity:.9;
      direction:ltr;
    }

    .seal-hint{
      position:absolute;
      z-index:21;
      left:50%;top:67%;
      transform:translateX(-50%);
      width:max-content;max-width:80%;
      padding:7px 13px;
      border-radius:999px;
      background:rgba(255,252,246,.76);
      border:1px solid rgba(145,111,70,.15);
      backdrop-filter:blur(8px);
      font-size:11px;
      color:#786f68;
      pointer-events:none;
      animation:hintPulse 2.6s ease-in-out infinite;
    }
    @keyframes hintPulse{50%{opacity:.52;transform:translateX(-50%) translateY(3px)}}

    /* ---------- CARD EMERGING ---------- */
    .card-stage{
      position:absolute;
      z-index:30;
      left:50%;top:50%;
      width:min(82vw,430px);
      transform:translate(-50%, 32%);
      pointer-events:none;
    }

    .card{
      position:relative;
      width:100%;
      aspect-ratio:720/1280;
      border-radius:4px;
      overflow:hidden;
      background:#fff;
      box-shadow:0 30px 70px rgba(54,38,28,.28),0 3px 8px rgba(54,38,28,.18);
      transform:translateY(76%) rotateX(10deg) rotateZ(-.6deg) scale(.93);
      transform-origin:50% 100%;
      opacity:0;
      transition:
        transform 1.9s cubic-bezier(.16,.84,.19,1),
        opacity .35s ease .12s;
    }

    .card img{
      display:block;
      width:100%;height:100%;
      object-fit:contain;
      user-select:none;
      -webkit-user-drag:none;
    }

    .opened .card{
      transform:translateY(0) rotateX(0) rotateZ(0) scale(1);
      opacity:1;
    }

    .card::after{
      content:"";
      position:absolute;inset:0;
      pointer-events:none;
      box-shadow:inset 0 0 0 1px rgba(94,67,44,.12);
    }

    /* ---------- FINAL CONTENT ---------- */
    .final{
      width:min(94vw,500px);
      margin-top:clamp(25px,5vh,45px);
      opacity:0;
      transform:translateY(24px);
      pointer-events:none;
      transition:opacity .8s ease,transform .8s ease;
      text-align:center;
    }
    .opened .final{
      opacity:1;
      transform:translateY(0);
      pointer-events:auto;
      transition-delay:1.65s;
    }

    .location-card{
      position:relative;
      padding:20px 22px 22px;
      border-radius:16px;
      background:rgba(250,247,241,.78);
      border:1px solid rgba(146,116,75,.18);
      box-shadow:0 16px 40px rgba(70,54,42,.10);
      backdrop-filter:blur(8px);
    }

    .location-icon{
      width:38px;height:38px;margin:0 auto 8px;
      display:grid;place-items:center;
      border-radius:50%;
      color:#fff;
      background:linear-gradient(145deg,#b59660,#8f7242);
      box-shadow:0 6px 14px rgba(103,78,43,.20);
    }

    .location-card h2{
      margin:2px 0 6px;
      font-family:"Marhey","Vazirmatn",serif;
      font-size:20px;
      font-weight:500;
      color:#655c56;
    }
    .location-card p{
      margin:4px 0;
      font-size:13px;
      line-height:1.9;
      color:#756c65;
    }
    .location-card a{
      display:inline-block;
      margin-top:11px;
      padding:9px 16px;
      border-radius:999px;
      text-decoration:none;
      color:#6f5732;
      background:rgba(181,154,98,.12);
      border:1px solid rgba(181,154,98,.25);
      font-size:12px;
      transition:.25s ease;
    }
    .location-card a:hover{background:rgba(181,154,98,.20);transform:translateY(-1px)}

    .music-control{
      position:fixed;
      z-index:100;
      left:20px;bottom:20px;
      width:48px;height:48px;
      display:grid;place-items:center;
      border:1px solid rgba(120,95,57,.2);
      border-radius:50%;
      color:#705b3a;
      background:rgba(250,247,241,.82);
      backdrop-filter:blur(10px);
      box-shadow:0 10px 25px rgba(62,48,36,.13);
      cursor:pointer;
      opacity:0;
      transform:translateY(10px) scale(.9);
      pointer-events:none;
      transition:.5s ease;
    }
    .opened .music-control{
      opacity:1;transform:none;pointer-events:auto;
      transition-delay:2s;
    }
    .music-control svg{width:20px;height:20px}

    .instruction{
      position:fixed;
      left:50%;bottom:18px;
      transform:translateX(-50%);
      font-size:10px;color:rgba(87,75,67,.48);
      pointer-events:none;
    }
    .opened .instruction{display:none}

    @media (max-width:600px){
      .scene{padding:14px}
      .experience{min-height:94svh}
      .pocket-wrap{width:min(88vw,470px)}
      .seal{width:76px;height:76px}
      .seal span{font-size:21px}
      .seal-hint{top:69%;font-size:10px}
      .card-stage{width:min(86vw,390px)}
      .final{margin-top:18px}
      .location-card{padding:17px}
      .music-control{left:auto;right:16px;bottom:16px}
    }

    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        transition-duration:.01ms!important;
        scroll-behavior:auto!important;
      }
    }
  </style>
</head>

<body>
  <main class="scene">
    <section class="experience" id="experience">

      <div class="pocket-wrap" id="pocketWrap" aria-label="پاکت دعوتنامه">
        <div class="pocket">
          <div class="pocket-back"></div>

          <div class="floral tl" aria-hidden="true">
            <div class="stem"></div>
            <div class="leaf l1"></div><div class="leaf l2"></div><div class="leaf l3"></div>
            <div class="flower f1"></div><div class="flower f2"></div>
          </div>

          <div class="floral br" aria-hidden="true">
            <div class="stem"></div>
            <div class="leaf l1"></div><div class="leaf l2"></div><div class="leaf l3"></div>
            <div class="flower f1"></div><div class="flower f2"></div>
          </div>

          <div class="flap"></div>
          <div class="pocket-front"></div>

          <button class="seal" id="seal" aria-label="باز کردن دعوتنامه">
            
            <small>WEDDING</small>
          </button>

          <div class="seal-hint">برای باز کردن، مهر را لمس کنید</div>
        </div>
      </div>

      <div class="card-stage" aria-live="polite">
        <div class="card" id="card">
          <img src="assets/wedding-card.jpg" alt="کارت دعوت عروسی" />
        </div>
      </div>

      <div class="final">
        <div class="location-card">
          <div class="location-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M20 10.2c0 5.2-8 11.3-8 11.3S4 15.4 4 10.2a8 8 0 1 1 16 0Z"/>
              <circle cx="12" cy="10" r="2.7"/>
            </svg>
          </div>

          <!-- این سه مورد را با اطلاعات واقعی مراسم جایگزین کنید -->
          <h2><a
            href="https://nshn.ir/de_bQmVDpxjWWj"
            target="_blank"
            rel="noopener noreferrer"
          > لوکیشن باغ   </h2>
          <p>
        </p>
          

          <!-- مختصات یا آدرس را در لینک زیر جایگزین کنید -->
          <a
            href="https://nshn.ir/de_bQmVDpxjWWj"
            target="_blank"
            rel="noopener noreferrer"
          >
            مشاهده مسیر در Google Maps
          </a>
        </div>
      </div>

      <button class="music-control" id="musicControl" aria-label="پخش یا توقف موسیقی" title="موسیقی">
        <svg id="musicIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
          <path d="M9 18V5l10-2v13"/>
          <circle cx="6.5" cy="18" r="3"/>
          <circle cx="16.5" cy="16" r="3"/>
        </svg>
      </button>

      <div class="instruction">مهر را لمس کنید</div>
    </section>
  </main>

  <!--
    MUSIC:
    فایل موسیقی خودتان را با نام music.mp3 داخل پوشه assets قرار دهید.
    اگر نام فایل متفاوت است، مقدار src را در خط زیر تغییر دهید.
  -->
  <audio id="weddingMusic" preload="auto" loop>
    <source src="assets/music.mp3.mp3" type="audio/mpeg">
  </audio>

  <script>
    const experience = document.getElementById("experience");
    const pocketWrap = document.getElementById("pocketWrap");
    const seal = document.getElementById("seal");
    const music = document.getElementById("weddingMusic");
    const musicControl = document.getElementById("musicControl");
    const musicIcon = document.getElementById("musicIcon");

    let opened = false;
    let playing = false;

    function setMusicIcon(isPlaying){
      musicIcon.innerHTML = isPlaying
        ? '<path d="M8 5v14M16 5v14"/>'
        : '<path d="M9 18V5l10-2v13"/><circle cx="6.5" cy="18" r="3"/><circle cx="16.5" cy="16" r="3"/>';
    }

    seal.addEventListener("click", async () => {
      if (opened) return;
      opened = true;

      experience.classList.add("opened");
      pocketWrap.classList.add("opened");

      // User interaction has now happened, so browsers allow audio playback.
      try {
        await music.play();
        playing = true;
        setMusicIcon(true);
      } catch (error) {
        // If the music file has not been added yet, the visual invitation still works.
        playing = false;
        setMusicIcon(false);
        console.info("Add assets/music.mp3 to enable the wedding music.");
      }

      // Remove the seal's focus ring after interaction.
      seal.blur();
    });

    musicControl.addEventListener("click", async () => {
      if (!opened) return;

      if (music.paused) {
        try {
          await music.play();
          playing = true;
          setMusicIcon(true);
        } catch (error) {
          playing = false;
          setMusicIcon(false);
        }
      } else {
        music.pause();
        playing = false;
        setMusicIcon(false);
      }
    });
  </script>
</body>
</html>
